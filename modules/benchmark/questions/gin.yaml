questions:
  - id: gin-q1
    repoId: gin
    text: "How does a request travel from Engine.ServeHTTP through the middleware/handler chain to a route's final handler, and what role does Context.Next() play in driving that flow?"
    category: GRAPH_HEAVY
    goldFacts:
      - id: gin-q1-f1
        statement: "Engine.ServeHTTP calls engine.handleHTTPRequest(c) to begin routing the incoming request."
        evidence: "gin.go:672"
      - id: gin-q1-f2
        statement: "Once c.handlers has been set to the matched route's HandlersChain (gin-q1-f6), handleHTTPRequest calls c.Next() to execute it."
        evidence: "gin.go:722"
      - id: gin-q1-f3
        statement: "Context.Next()'s loop body invokes c.handlers[c.index](c) — this is the mechanism that actually runs the middleware/handler chain."
        evidence: "context.go:192"
      - id: gin-q1-f4
        statement: "RouterGroup.combineHandlers appends a route's own handlers after the group's already-copied middleware (gin-q2-f4) via copy(mergedHandlers[len(group.Handlers):], handlers), producing the single HandlersChain that Next() (gin-q1-f3) later iterates."
        evidence: "routergroup.go:246"
      - id: gin-q1-f5
        statement: "handleHTTPRequest looks up the request path in the method's radix tree via root.getValue(rPath, c.params, c.skippedNodes, unescape)."
        evidence: "gin.go:715"
      - id: gin-q1-f6
        statement: "When that lookup finds a match, handleHTTPRequest assigns c.handlers = value.handlers — the HandlersChain combineHandlers built at registration time (gin-q1-f4) becomes the exact chain Next() executes at request time."
        evidence: "gin.go:720"

  - id: gin-q2
    repoId: gin
    text: "Why does middleware attached globally via Engine.Use still run on a request that hits the 404 (no matching route) fallback path, and what recomputes the fallback handler chain to include it?"
    category: GRAPH_HEAVY
    goldFacts:
      - id: gin-q2-f1
        statement: "Engine.Use calls engine.RouterGroup.Use(middleware...) to append the given middleware to the engine's own accumulated Handlers list."
        evidence: "gin.go:341"
      - id: gin-q2-f2
        statement: "Engine.Use calls engine.rebuild404Handlers() immediately after appending the middleware (gin-q2-f1), so attaching global middleware after NoRoute was already configured still refreshes the 404 fallback chain."
        evidence: "gin.go:342"
      - id: gin-q2-f3
        statement: "rebuild404Handlers recomputes engine.allNoRoute as engine.combineHandlers(engine.noRoute) — combineHandlers here is the method Engine inherits from its embedded RouterGroup."
        evidence: "gin.go:357"
      - id: gin-q2-f4
        statement: "combineHandlers copies the RouterGroup's own accumulated Handlers (the global middleware list Engine.Use appends to) to the front of the merged chain via copy(mergedHandlers, group.Handlers) — this is the specific step that puts global middleware into engine.allNoRoute."
        evidence: "routergroup.go:245"
      - id: gin-q2-f5
        statement: "When handleHTTPRequest finds no matching route, it sets c.handlers = engine.allNoRoute — the global-middleware-plus-noRoute chain computed above (gin-q2-f3, gin-q2-f4) — immediately before the serveError call examined in gin-q2-f6."
        evidence: "gin.go:758"
      - id: gin-q2-f6
        statement: "serveError calls c.Next() — the same Next() whose loop over c.handlers (established in gin-q1-f3) executes the handler chain — which is why middleware attached globally via Use() (e.g. Logger/Recovery) still runs on a request that never matched a registered route."
        evidence: "gin.go:766"

  - id: gin-q3
    repoId: gin
    text: "How does registering a route with RouterGroup.GET travel through RouterGroup into Engine.addRoute and the per-method radix tree, and how does Engine.Routes() read the registered routes back — including which handler in each node's stored chain it reports?"
    category: GRAPH_HEAVY
    goldFacts:
      - id: gin-q3-f1
        statement: "RouterGroup.GET is a shortcut that calls group.handle(http.MethodGet, relativePath, handlers)."
        evidence: "routergroup.go:117"
      - id: gin-q3-f2
        statement: "RouterGroup.handle calls group.engine.addRoute(httpMethod, absolutePath, handlers), handing the merged handlers and absolute path off to the Engine's route tree."
        evidence: "routergroup.go:89"
      - id: gin-q3-f3
        statement: "Engine.addRoute's route-registration step is calling root.addRoute(path, handlers), which inserts the new route into the per-method radix tree in engine.trees."
        evidence: "gin.go:377"
      - id: gin-q3-f4
        statement: "node.addRoute in tree.go is the function that actually inserts the path and its handlers into the radix tree used for request matching."
        evidence: "tree.go:135"
      - id: gin-q3-f5
        statement: "Engine.Routes() walks engine.trees via the iterate() helper to read back every registered method/path/handler as RouteInfo."
        evidence: "gin.go:392"
      - id: gin-q3-f6
        statement: "iterate(), the recursive helper Engine.Routes() drives, reads each route's reported Handler via root.handlers.Last() — the handler chain stored on that radix-tree node by node.addRoute/insertChild at registration time, not anything a text search on the identifier addRoute would show on its own."
        evidence: "gin.go:400"

  - id: gin-q4
    repoId: gin
    text: "If binding.Binding's Bind(*http.Request, any) error method signature changed, which concrete types and Context call sites would break?"
    category: GRAPH_HEAVY
    goldFacts:
      - id: gin-q4-f1
        statement: "binding.Binding declares the Bind(*http.Request, any) error method that every concrete type implementing the Binding interface (as distinct from the separate BindingUri interface, which uriBinding implements instead) must provide."
        evidence: "binding/binding.go:34"
      - id: gin-q4-f2
        statement: "jsonBinding is one concrete implementation of Binding; its Bind method decodes the HTTP request body as JSON and then validates the resulting struct."
        evidence: "binding/json.go:33"
      - id: gin-q4-f3
        statement: "Package binding declares thirteen concrete Binding-interface implementations in the same var block as JSON — JSON, XML, Form, Query, FormPost, FormMultipart, ProtoBuf, MsgPack, YAML, Header, Plain, TOML, and BSON — every one of which would need updating if Binding.Bind's signature changed; Uri is the sole entry in that block that implements the separate BindingUri interface instead."
        evidence: "binding/binding.go:76"
      - id: gin-q4-f4
        statement: "Context.ShouldBindWith calls b.Bind(c.Request, obj) directly on whatever Binding implementation is passed in, so any change to Bind's signature breaks this call site."
        evidence: "context.go:920"
      - id: gin-q4-f5
        statement: "Context.MustBindWith delegates to c.ShouldBindWith(obj, b) for the actual bind call, so it also depends transitively on Binding.Bind's signature."
        evidence: "context.go:811"
      - id: gin-q4-f6
        statement: "Beyond MustBindWith/ShouldBindWith and the typed shortcuts (BindJSON, BindXML, BindQuery, ...), the deprecated Context.BindWith(obj any, b binding.Binding) is a third, generic call site that also funnels straight into c.MustBindWith(obj, b) — every one of these call sites breaks if Binding.Bind's signature changes."
        evidence: "deprecated.go:22"

  - id: gin-q5
    repoId: gin
    text: "How does Engine.LoadHTMLGlob configure HTML rendering in both debug and non-debug mode, and how does Context.HTML use that configuration through the render.HTMLRender interface to produce a response?"
    category: GRAPH_HEAVY
    goldFacts:
      - id: gin-q5-f1
        statement: "In non-debug (release/test) mode, Engine.LoadHTMLGlob calls engine.SetHTMLTemplate(templ) to install engine.HTMLRender."
        evidence: "gin.go:283"
      - id: gin-q5-f2
        statement: "In debug mode — gin's default when GIN_MODE is unset and the process is not running under go test (gin-q6-f2, gin-q6-f5, gin-q6-f6) — LoadHTMLGlob's IsDebugging() branch assigns engine.HTMLRender = render.HTMLDebug{Glob: pattern, FuncMap: engine.FuncMap, Delims: engine.delims}, bypassing the SetHTMLTemplate call examined in gin-q5-f1 entirely."
        evidence: "gin.go:279"
      - id: gin-q5-f3
        statement: "SetHTMLTemplate (only reached in the non-debug branch) assigns engine.HTMLRender = render.HTMLProduction{Template: templ.Funcs(engine.FuncMap)}."
        evidence: "gin.go:317"
      - id: gin-q5-f4
        statement: "render.HTMLProduction.Instance returns an HTML{} value that implements the render.Render interface for the requested template name."
        evidence: "render/html.go:54"
      - id: gin-q5-f5
        statement: "Context.HTML calls c.engine.HTMLRender.Instance(name, obj) to obtain a render.Render instance from whichever concrete HTMLRender (production or debug) the Engine was configured with."
        evidence: "context.go:1172"
      - id: gin-q5-f6
        statement: "Context.Render, which Context.HTML calls into, invokes r.Render(c.Writer) to actually execute the template and write the response body."
        evidence: "context.go:1161"

  - id: gin-q6
    repoId: gin
    text: "What are gin's three run modes, the environment variable used to select one, and how does SetMode choose a default when no mode is configured?"
    category: NEUTRAL
    goldFacts:
      - id: gin-q6-f1
        statement: "EnvGinMode is the environment variable name gin reads to select its mode: \"GIN_MODE\"."
        evidence: "mode.go:17"
      - id: gin-q6-f2
        statement: "DebugMode is the string constant \"debug\"."
        evidence: "mode.go:21"
      - id: gin-q6-f3
        statement: "ReleaseMode is the string constant \"release\"."
        evidence: "mode.go:23"
      - id: gin-q6-f4
        statement: "TestMode is the string constant \"test\"."
        evidence: "mode.go:25"
      - id: gin-q6-f5
        statement: "init() reads the target mode from the GIN_MODE environment variable via os.Getenv(EnvGinMode)."
        evidence: "mode.go:53"
      - id: gin-q6-f6
        statement: "When SetMode receives an empty value, it chooses TestMode if flag.Lookup(\"test.v\") is non-nil (running under go test), otherwise DebugMode."
        evidence: "mode.go:60"

  - id: gin-q7
    repoId: gin
    text: "What fields does LogFormatterParams carry for each logged request, and what ANSI colors does StatusCodeColor assign to successful versus server-error status codes?"
    category: NEUTRAL
    goldFacts:
      - id: gin-q7-f1
        statement: "LogFormatterParams is the struct that carries per-request data (request, timestamp, status code, latency, client IP, method, path, error message, body size) into the log formatter."
        evidence: "logger.go:68"
      - id: gin-q7-f2
        statement: "StatusCodeColor returns the ANSI color green for status codes in the 2xx range (StatusOK up to but excluding StatusMultipleChoices)."
        evidence: "logger.go:101"
      - id: gin-q7-f3
        statement: "StatusCodeColor returns the ANSI color red as its default case, covering status codes not matched by the earlier ranges — that is, codes below http.StatusContinue (100) as well as http.StatusInternalServerError (500) and above."
        evidence: "logger.go:107"
      - id: gin-q7-f4
        statement: "green is defined as the literal ANSI escape sequence \"\\033[97;42m\"."
        evidence: "logger.go:26"
      - id: gin-q7-f5
        statement: "defaultLogFormatter builds the console log line with fmt.Sprintf, prefixed with \"[GIN]\" and including the colored status code, latency, client IP, method, and path."
        evidence: "logger.go:185"

  - id: gin-q8
    repoId: gin
    text: "What is the exact literal response body gin writes by default when no route matches (404) versus when the method is not allowed (405), and where are those literals defined and used?"
    category: NEGATIVE_CONTROL
    goldFacts:
      - id: gin-q8-f1
        statement: "default404Body is the literal byte slice []byte(\"404 page not found\")."
        evidence: "gin.go:33"
      - id: gin-q8-f2
        statement: "default405Body is the literal byte slice []byte(\"405 method not allowed\")."
        evidence: "gin.go:34"
      - id: gin-q8-f3
        statement: "handleHTTPRequest calls serveError(c, http.StatusNotFound, default404Body) when no route matches the request and no redirect condition applies."
        evidence: "gin.go:759"
      - id: gin-q8-f4
        statement: "serveError writes defaultMessage directly to the response body via c.Writer.Write(defaultMessage) when the final status still equals the code it was given and nothing else has written to the response."
        evidence: "gin.go:772"
