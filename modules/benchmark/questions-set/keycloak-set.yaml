# Keycloak set-recall question set -- the 5 questions the A/B on the big repo runs.
#
# Why this file exists as a file. These questions were originally generated into a
# temp directory and passed via --questions-dir, so the only surviving copy was
# embedded in a result JSON; the set that produced the screening numbers could not
# be re-run. It lives in the repository now for exactly that reason.
#
# Why these five, out of the eight screened (results/set-screen/):
#
#   q1, q2, q3  -- calls to `name`/`type`/`build` on ProviderConfigurationBuilder,
#                  a fluent builder. Multi-line call chains.
#   q5, q8      -- calls to `getId` on RootAuthenticationSessionModel /
#                  UserSessionModel. Single-line calls, expensive for a baseline
#                  to find by brute force ($1.77 / $8.36 in screening).
#
# ---------------------------------------------------------------------------
# GROUND TRUTH REGENERATED 2026-08-21. Do not restore the previous values.
#
# The screening run's ground truth was produced one minute before tools/java-callsites
# was fixed, and carried that tool's off-by-one: JavaParser's MethodCallExpr begins at
# the start of its whole receiver chain, so in
#
#     builder.property()      <- line 88: what the old ground truth recorded
#            .name(X)         <- line 89: where the call actually is
#            .type(Y)         <- line 90
#
# every call in the chain reported line 88. Two defects, one cause:
#
#   1. Every line in a multi-line chain was wrong (off by the chain's depth).
#   2. Distinct calls collapsed onto one `path:line` string and were deduplicated
#      away by the set that holds them -- so the answer was also less than half
#      its true size. q1 went 65 -> 141, q2 63 -> 139.
#
# It scored real answers as wrong, and only on chained calls, which is why it read
# as a targeted failure rather than a broken instrument: q1/q2 scored 0.00 (no line
# survived), q3 scored 0.16 (11 of its 65 lines happened to be unchained -- 11/65 =
# 0.169, the measured accuracy to three decimals), while q5/q8 scored 0.92-0.98
# (single-line calls, untouched). Regenerated here with `call.name.begin`, from
# `.benchmark-corpus/keycloak/without` at the pinned SHA, over the five source roots
# the question text names, test sources excluded.
#
# Written as JSON, which is valid YAML.
